syntax = "proto3";

package snapshotplugin;

option go_package = "github.com/agent-substrate/substrate/pkg/proto/snapshotpluginpb";

// NodeProviderPlugin is the plugin API a snapshot storage platform implements
// on every node. atelet calls it to move actor snapshot files between the
// node's local disk and the platform's storage. How the files are stored
// (object names, compression, block devices) is private to the plugin; the
// only requirement is that FetchSnapshot returns the bytes UploadSnapshot was
// given.
//
// Callers name every file they want moved. A snapshot's file list lives in
// its manifest, which the caller fetches first by name. The caller also owns
// commit ordering: it uploads the data files, and only after that call
// succeeds does it upload the manifest in a separate call, so a reader that
// finds the manifest can rely on every file it lists.
//
// Every RPC is idempotent: retries overwrite the same stored objects and the
// same local files.
service NodeProviderPlugin {
  // FetchSnapshot downloads the named files of a snapshot into write_path.
  // It returns NOT_FOUND if any requested file is absent from the snapshot.
  rpc FetchSnapshot(FetchSnapshotRequest) returns (FetchSnapshotResponse) {}

  // UploadSnapshot uploads the named files from local_path into a snapshot.
  rpc UploadSnapshot(UploadSnapshotRequest) returns (UploadSnapshotResponse) {}
}

// FetchSnapshotRequest asks the plugin to download snapshot files.
message FetchSnapshotRequest {
  // The snapshot to read, e.g. gs://<bucket>/<prefix>/.
  string snapshot_uri = 1;

  // The JWT of the actor that owns the snapshot, for plugins that authorize
  // storage access per actor. Empty when the plugin uses its own credentials.
  string actor_jwt = 2;

  // Absolute local directory the files are written into. It must exist.
  string write_path = 3;

  // Base names of the files to download. Required; names containing a path
  // separator or ".." are rejected with INVALID_ARGUMENT.
  repeated string files = 4;
}

// FetchSnapshotResponse is empty; success means every file was written.
message FetchSnapshotResponse {}

// UploadSnapshotRequest asks the plugin to upload snapshot files.
message UploadSnapshotRequest {
  // The snapshot to write, e.g. gs://<bucket>/<prefix>/.
  string snapshot_uri = 1;

  // The JWT of the actor that owns the snapshot, for plugins that authorize
  // storage access per actor. Empty when the plugin uses its own credentials.
  string actor_jwt = 2;

  // Absolute local directory the files are read from.
  string local_path = 3;

  // Base names of the files to upload. Required; names containing a path
  // separator or ".." are rejected with INVALID_ARGUMENT.
  repeated string files = 4;
}

// UploadSnapshotResponse is empty; success means every file is durably stored.
message UploadSnapshotResponse {}

// ServerProviderPlugin is the plugin API a snapshot storage platform
// implements for the control plane. ate-api-server calls it to manage whole
// snapshots without touching their contents.
service ServerProviderPlugin {
  // CleanupSnapshot deletes every file of a snapshot, or of every snapshot
  // under an owner's prefix. Deleting an absent snapshot succeeds.
  rpc CleanupSnapshot(CleanupSnapshotRequest) returns (CleanupSnapshotResponse) {}

  // CopySnapshot copies every file of src_uri to dst_uri, overwriting files
  // already at dst_uri. It returns FAILED_PRECONDITION if src_uri holds no
  // files.
  rpc CopySnapshot(CopySnapshotRequest) returns (CopySnapshotResponse) {}
}

// CleanupSnapshotRequest names the snapshots to delete.
message CleanupSnapshotRequest {
  // A snapshot URI, or the prefix of a resource that owns several snapshots
  // (e.g. gs://<bucket>/<root>/atespaces/<atespace>/actors/<uid>). Every file
  // below it is deleted. A bare bucket is rejected with INVALID_ARGUMENT.
  string snapshot_uri = 1;
}

// CleanupSnapshotResponse is empty.
message CleanupSnapshotResponse {}

// CopySnapshotRequest names the source and destination snapshots.
message CopySnapshotRequest {
  string src_uri = 1;
  string dst_uri = 2;
}

// CopySnapshotResponse is empty.
message CopySnapshotResponse {}
